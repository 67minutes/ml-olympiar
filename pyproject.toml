[project]
name = "rj-olympiar"
version = "0.1.0"
description = "Ramba Joring geochem + ML pipeline for OlympiAR 2026 Round 2 (local only, confidential data)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "matplotlib",
    "seaborn",
    "geopandas",
    "pyogrio",
    "shapely",
    "rasterio",
    "hmmlearn",
    "lightgbm",
    "shap",
    "mapie",
    "openpyxl",
    "pypdf",
]

[dependency-groups]
dev = ["pytest", "ipykernel"]
iogas = [
    "grpcio>=1.85.1",
    "grpcio-tools>=1.85.1",
    "protobuf>=7.36.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
default-groups = ["dev", "iogas"]
