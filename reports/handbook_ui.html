<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ramba Joring · Buku temuan / Findings handbook</title>
<style>
*{box-sizing:border-box}html{overflow-anchor:none;scroll-padding-top:5rem}body{margin:0;padding-top:3.5rem;background:#f6f4ec;color:#182b2b;font:17px/1.62 Georgia,"Times New Roman",serif}html[lang=id] .en,html[lang=en] .id,[hidden]{display:none!important}a{color:#145b5c;text-underline-offset:3px}a:hover{color:#8e4620}header{position:fixed;top:0;left:0;right:0;background:#163536;color:#fff;z-index:5;font:600 .88rem/1.3 Arial,sans-serif;display:flex;justify-content:space-between;align-items:center;padding:.72rem max(4vw,1rem);gap:.6rem}header a{color:white}#switch{display:flex;gap:3px;border:1px solid #86a39d;padding:3px;border-radius:5px}button,input,select{font:inherit}button{cursor:pointer}#switch button{border:0;border-radius:2px;background:transparent;color:#fff;padding:.45rem .65rem}#switch [aria-pressed=true]{background:#f8f6e9;color:#183d3a}main{max-width:1460px;margin:auto;display:grid;grid-template-columns:minmax(180px,235px) minmax(0,850px);justify-content:center;gap:5vw;padding:2.5rem 4vw 5rem}nav{font:.88rem/1.4 Arial,sans-serif;position:sticky;top:5rem;align-self:start;max-height:82vh;overflow:auto;border-left:2px solid #bac7bb;padding:.25rem 0 .25rem 1rem}nav a{display:block;text-decoration:none;padding:.28rem 0}nav a:hover{text-decoration:underline}article{min-width:0}section{padding:2.3rem 0 1rem;border-top:1px solid #afbcb2;scroll-margin-top:1rem}section:first-child{padding-top:0;border:0}.eyebrow,.tag,.meta{font:600 .75rem/1.6 Arial,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:#526b64}h1,h2,h3{font-weight:500;line-height:1.12;text-wrap:balance}h1{font-size:clamp(2.6rem,6vw,5.3rem);margin:.45rem 0 1.25rem;letter-spacing:-.045em}h2{font-size:clamp(2rem,4vw,3.1rem);margin:.45rem 0 1rem;letter-spacing:-.035em}h3{font-size:1.48rem}.lead{font-size:1.3rem;line-height:1.5}p{max-width:76ch}figure{margin:1.7rem 0;background:#fff;border:1px solid #cad1c6}figure img{display:block;width:100%;height:auto}figcaption{padding:1rem 1.2rem;border-top:1px solid #d5dcd0;font:.94rem/1.5 Arial,sans-serif}.meta{display:block;margin-bottom:.35rem}.source{font: .78rem/1.4 ui-monospace,Consolas,monospace;overflow-wrap:anywhere;display:block;margin-top:.45rem}details,blockquote{margin:1.1rem 0;padding:.9rem 1.1rem}details{border:1px solid #bdcbbf}summary{cursor:pointer;font:bold .96rem/1.5 Arial,sans-serif}blockquote{background:#e6ede4;border-left:4px solid #447966}blockquote p{margin:.45rem 0}.tablebox{overflow-x:auto}table{border-collapse:collapse;width:100%;font:.91rem/1.45 Arial,sans-serif;margin:1rem 0}th,td{text-align:left;padding:.55rem;border-bottom:1px solid #c4cec4}th{color:#234b43;background:#e4eade}ul.refs{columns:2;padding-left:1.3rem}.refs li{break-inside:avoid;margin:.3rem 0}.refs a,.term strong,code{font: .87rem/1.4 Consolas,monospace;overflow-wrap:anywhere}.search{width:100%;padding:.65rem .85rem;border:1px solid #799087;background:white;color:inherit}.filters{display:flex;gap:.6rem;flex-wrap:wrap}.filters label{flex:1 1 12rem}.filters select{width:100%;padding:.64rem}.entry,.term{padding:.72rem 0;border-bottom:1px solid #d1d8ce;font:.94rem/1.5 Arial,sans-serif;overflow-wrap:anywhere}.entry a{font-weight:600}.entry small{color:#53665e}.term strong{font-weight:bold;display:block}.term span,.entry span{line-height:1.5}.summary-list li{margin:.7rem 0}.note{font:.9rem/1.5 Arial,sans-serif}.chapterjump{display:inline-block;margin:.5rem 0}.swatch{display:inline-block;width:.8em;height:.8em;margin-right:.3em}.tocmobile{display:none}
@media(max-width:780px){main{display:block;padding:1.3rem 1rem 3rem}nav{position:static;max-height:none;margin-bottom:1rem}nav:not(.open){display:none}.tocmobile{display:block;background:transparent;color:white;border:1px solid #86a39d;border-radius:3px;padding:5px}header{padding:.5rem .7rem}.brand{display:none}ul.refs{columns:1}figcaption{padding:.8rem}.lead{font-size:1.14rem}}
@media print{header,nav,.filters,.search,.chapterjump,.tocmobile{display:none!important}main{display:block;padding:0}body{background:white;color:black;font:12pt/1.4 "Times New Roman",serif}section{break-before:page}h1,h2{font-size:16pt}h3{font-size:14pt}figure,table{break-inside:avoid}figcaption{font:12pt "Times New Roman",serif}}
</style></head><body>
<header><span class="brand">OlympiAR 2026 · Ramba Joring</span><button class="tocmobile" onclick="document.querySelector('nav').classList.toggle('open');if(document.querySelector('nav').classList.contains('open'))document.querySelector('nav').scrollIntoView()"><span class="id">Daftar isi</span><span class="en">Contents</span></button><div id="switch" aria-label="Bahasa / Language"><button data-lang="id" aria-pressed="true" lang="id">Bahasa Indonesia</button><button data-lang="en" aria-pressed="false" lang="en">English</button></div></header>
<main><nav>@@NAV@@</nav><article>@@BODY@@</article></main>
<script>
const root=document.documentElement;
function filterList(kind){
 const query=document.getElementById(kind+'-query').value.toLowerCase().trim();
 const chapter=kind==='index'?document.getElementById('chapter-filter').value:'';
 let count=0;
 document.querySelectorAll('[data-list="'+kind+'"]').forEach(row=>{
 const show=query.split(/\s+/).every(word=>row.textContent.toLowerCase().includes(word))&&(!chapter||row.dataset.chapters.split(/,\s*/).includes(chapter));
 row.hidden=!show;if(show)count++;
 });
 const out=document.getElementById(kind+'-count');out.textContent=new Intl.NumberFormat(root.lang).format(count)+(root.lang==='id'?' entri':' entries');
}
function language(lang){
 const parts=[...document.querySelectorAll('[data-place]')];
 const near=parts.filter(p=>p.checkVisibility() && p.getBoundingClientRect().height>0 && p.getBoundingClientRect().top<=100).pop()||parts[0];
 const before=near.getBoundingClientRect().top;
 root.lang=lang;
 try{sessionStorage.setItem("rj-handbook-lang",lang)}catch{}
 document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
 document.querySelectorAll('[data-id-label]').forEach(e=>{e.textContent=e.dataset[lang+'Label']});
 filterList('index');filterList('terms');window.scrollBy(0,near.getBoundingClientRect().top-before);
}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>language(b.dataset.lang));
for(const kind of ['index','terms'])document.getElementById(kind+'-query').oninput=()=>filterList(kind);
document.getElementById('chapter-filter').onchange=()=>filterList('index');
document.querySelectorAll('.chapterjump').forEach(a=>a.onclick=()=>{
 document.getElementById('chapter-filter').value=a.dataset.chapter;
 document.getElementById('index-query').value='';filterList('index');
});
document.querySelectorAll('a[href="#index"]:not(.chapterjump)').forEach(a=>a.onclick=()=>{
 document.getElementById('chapter-filter').value='';document.getElementById('index-query').value='';filterList('index');
});
document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',()=>document.querySelector('nav').classList.remove('open')));
let initial='id';try{if(sessionStorage.getItem('rj-handbook-lang')==='en')initial='en'}catch{}
language(initial);
</script></body></html>
